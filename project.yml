name: SmartPillow
options:
  bundleIdPrefix: com.jarvishome
  deploymentTarget:
    iOS: "16.0"
targets:
  SmartPillow:
    type: application
    platform: iOS
    sources:
      - SmartPillow
    info:
      path: SmartPillow/Info.plist
      properties:
        CFBundleDisplayName: 智能枕头
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: 需要访问家里的局域网，才能连接和控制智能枕头。
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Dark
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jarvishome.smartpillow
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
