name: Simulator Screenshots

# 在云端 iPhone 模拟器里用演示数据逐页截图，打包发布到 Releases，方便不连手机也能检查界面。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  shots:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          phones = [x for k, v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")]
          pro = [x for x in phones if "Pro" in x["name"] and "Max" not in x["name"]]
          print((pro or phones)[-1]["udid"])')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -project SmartPillow.xcodeproj \
            -scheme SmartPillow \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u || true
          test -f build/Build/Products/Release-iphonesimulator/SmartPillow.app/SmartPillow

      - name: Capture every screen
        shell: bash {0}
        run: |
          mkdir -p shots
          exec > >(tee shots/capture.log) 2>&1
          set -x
          UDID="${{ steps.sim.outputs.udid }}"
          APP=com.jarvishome.smartpillow
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark
          xcrun simctl status_bar "$UDID" override --time "22:47" --batteryLevel 100
          xcrun simctl install "$UDID" build/Build/Products/Release-iphonesimulator/SmartPillow.app
          # 冷启动一次再开始拍：慢机器上第一次启动常常还没画出来
          xcrun simctl launch "$UDID" "$APP" -uiScreen tonight -onboarded YES -demoMode YES
          sleep 25
          for s in onboarding tonight alarm recording report history assist device setup calibrate; do
            ONB=YES; [ "$s" = onboarding ] && ONB=NO
            xcrun simctl terminate "$UDID" "$APP"
            xcrun simctl launch "$UDID" "$APP" \
              -uiScreen "$s" -onboarded "$ONB" -demoMode YES -demoOffset 200 -seedDemo YES \
              -AppleLanguages "(zh-Hans)" -AppleLocale zh_CN
            sleep 10
            xcrun simctl io "$UDID" screenshot "shots/$s.png"
            # 报告和设备页额外再拍一张，用来区分“渲染慢”和“卡死”
            if [ "$s" = report ] || [ "$s" = assist ]; then
              sleep 15
              xcrun simctl io "$UDID" screenshot "shots/${s}-late.png"
            fi
          done
          xcrun simctl spawn "$UDID" log show --last 15m --predicate 'process == "SmartPillow" AND (messageType == error OR messageType == fault)' --style compact > shots/app.log 2>&1
          ls ~/Library/Logs/DiagnosticReports/ 2>/dev/null | grep -i smartpillow > shots/crashes.txt || true
          cp ~/Library/Logs/DiagnosticReports/SmartPillow* shots/ 2>/dev/null || true
          ls -l shots
          exit 0

      - name: Package screenshots
        if: always()
        run: cd shots && zip -q ../screens.zip *

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots

      - name: Publish screenshots
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: shots-${{ github.run_number }}
          name: Simulator screenshots ${{ github.run_number }}
          files: screens.zip
          prerelease: true
