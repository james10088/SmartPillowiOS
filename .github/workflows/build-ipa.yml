name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project SmartPillow.xcodeproj \
            -scheme SmartPillow \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build > build.log 2>&1 || true
          grep -E "error:|BUILD (SUCCEEDED|FAILED)" build.log | sort -u > errors.txt || true
          cat errors.txt
          # 必须真的生成了可执行文件才算成功
          test -f build/Build/Products/Release-iphoneos/SmartPillow.app/SmartPillow

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SmartPillow.app Payload/
          zip -qry SmartPillow.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: SmartPillow-ipa
          path: SmartPillow.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - name: Publish build errors
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: errors-${{ github.run_number }}
          name: Build errors ${{ github.run_number }}
          files: |
            errors.txt
            build.log
          prerelease: true

      - name: Publish download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: SmartPillow build ${{ github.run_number }}
          files: SmartPillow.ipa
          prerelease: true
